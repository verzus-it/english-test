<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title><%= htmlWebpackPlugin.options.title %></title>
    <script type="text/javascript" >
		var base;
		var marker = 'apps/introTests/';
		var idx = window.location.pathname.indexOf(marker);
		if (idx !== -1) {
			// приложение открыто по своему пути (в т.ч. /platform/apps/introTests/)
			base = window.location.pathname.slice(0, idx + marker.length);
		} else {
			// корень (например, localhost с портом)
			base = '/';
		}

		document.write('<base href="' + base + '"/>');
    </script>
</head>
<body>
    <main id="app"></main>
</body>
</html>
